[tool.ruff]
# Single source of truth for Python lint/format across backend/ and scripts/.
# Rule selection is explicit (never rely on ruff's evolving defaults) so
# local dev and CI always agree. See docs/GITHUB_WORKFLOW.md.
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
	"E4",  # pycodestyle errors
	"E7",
	"E9",
	"F",   # pyflakes
	"I",   # isort-style import ordering
]

[tool.ruff.format]
quote-style = "double"

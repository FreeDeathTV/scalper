[mypy]
# Heavy ASR/audio backends are optional runtime extras (see requirements-extras.txt);
# each engine module guards its own import at runtime, so we don't require type stubs.

[mypy-ctranslate2.*]
ignore_missing_imports = True

[mypy-onnxruntime.*]
ignore_missing_imports = True

[mypy-pyannote.*]
ignore_missing_imports = True

[mypy-librosa.*]
ignore_missing_imports = True

[mypy-rnnoise_python.*]
ignore_missing_imports = True

[mypy-soundfile.*]
ignore_missing_imports = True

[mypy-whisperx.*]
ignore_missing_imports = True

[mypy-nemo.*]
ignore_missing_imports = True

[mypy-faster_whisper.*]
ignore_missing_imports = True

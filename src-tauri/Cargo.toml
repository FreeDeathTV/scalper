[package]
name = "scalper-transcriber"
version = "0.1.0"
description = "Fully-local speech-to-text desktop app"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portpicker = "0.1"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
